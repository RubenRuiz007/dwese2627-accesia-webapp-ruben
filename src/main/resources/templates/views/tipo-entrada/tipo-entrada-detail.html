<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Accesia - Tipo de entrada')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>
<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle del tipo de entrada: {nombre} -->
        <h1>
            <span th:text="#{msg.tipoEntrada-detail.title}"></span>:
            <span th:text="${tipoEntrada.nombre}"></span>
        </h1>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Datos del tipo de entrada -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.tipoEntrada-detail.section.tipoEntradaData}"></h2>
            <dl class="row">
                <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.field.id}"></dt>
                <dd class="col-sm-8" th:text="${tipoEntrada.id}"></dd>

                <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.field.nombre}"></dt>
                <dd class="col-sm-8" th:text="${tipoEntrada.nombre}"></dd>

                <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.field.precioReferencia}"></dt>
                <dd class="col-sm-8" th:text="${tipoEntrada.precioReferencia} + ' €'"></dd>

                <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.field.cupo}"></dt>
                <dd class="col-sm-8" th:text="${tipoEntrada.cupo} ?: '-'"></dd>

            </dl>
        </div>

        <!-- Establecimiento que ofrece este tipo de entrada (uno solo) -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.tipoEntrada-detail.section.establecimiento}"></h2>

            <div th:if="${tipoEntrada.establecimiento == null}" class="alert alert-info"
                 th:text="#{msg.tipoEntrada-detail.establecimiento.empty}"></div>

            <div th:if="${tipoEntrada.establecimiento != null}">
                <dl class="row">
                    <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.establecimiento.field.id}"></dt>
                    <dd class="col-sm-8" th:text="${tipoEntrada.establecimiento.id}"></dd>

                    <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.establecimiento.field.nombre}"></dt>
                    <dd class="col-sm-8" th:text="${tipoEntrada.establecimiento.nombre}"></dd>

                    <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.establecimiento.field.tipo}"></dt>
                    <dd class="col-sm-8" th:text="#{${'msg.tipoEstablecimiento.' + tipoEntrada.establecimiento.tipo}}"></dd>

                    <dt class="col-sm-4" th:text="#{msg.tipoEntrada-detail.establecimiento.field.direccion}"></dt>
                    <dd class="col-sm-8" th:text="${tipoEntrada.establecimiento.direccion}"></dd>
                </dl>

                <!-- Ver detalle del establecimiento -->
                <a class="btn btn-sm btn-outline-primary me-2"
                   th:href="@{/establecimientos/detail(id=${tipoEntrada.establecimiento.id})}"
                   th:text="#{msg.tipoEntrada-detail.establecimiento.viewDetail}"></a>
            </div>
        </div>

        <!-- Volver -->
        <div class="mt-4">
            <a class="btn btn-secondary" th:href="@{/tipos-entrada}" th:text="#{msg.tipoEntrada-detail.action.back}"></a>
        </div>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
