<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Accesia - Tipo de entrada')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>
<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título dinámico (alta / edición) -->
        <h1 th:text="${tipoEntrada.id} == null ? #{msg.tipoEntrada-form.add} : #{msg.tipoEntrada-form.edit}"></h1>

        <!-- Mensaje de error global -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Formulario: si no hay id es un alta, si hay id es una edición -->
        <form th:action="${tipoEntrada.id} == null ? @{/tipos-entrada/insert} : @{/tipos-entrada/update}"
              th:object="${tipoEntrada}" method="post" class="mt-3">

            <input type="hidden" th:field="*{id}"/>

            <!-- Nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label" th:text="#{msg.tipoEntrada-form.nombre}"></label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" maxlength="100" />
                <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
            </div>

            <!-- Precio de referencia (con 2 decimales) -->
            <div class="mb-3">
                <label for="precioReferencia" class="form-label" th:text="#{msg.tipoEntrada-form.precioReferencia}"></label>
                <input type="number" id="precioReferencia" th:field="*{precioReferencia}" class="form-control" min="0" step="0.01" />
                <div th:if="${#fields.hasErrors('precioReferencia')}" class="text-danger" th:errors="*{precioReferencia}"></div>
            </div>

            <!-- Cupo (opcional) -->
            <div class="mb-3">
                <label for="cupo" class="form-label" th:text="#{msg.tipoEntrada-form.cupo}"></label>
                <input type="number" id="cupo" th:field="*{cupo}" class="form-control" min="1" />
                <div th:if="${#fields.hasErrors('cupo')}" class="text-danger" th:errors="*{cupo}"></div>
            </div>

            <!-- Establecimiento (select). En edición aparece seleccionado el establecimiento actual -->
            <div class="mb-3">
                <label for="establecimientoId" class="form-label" th:text="#{msg.tipoEntrada-form.establecimiento}"></label>
                <select id="establecimientoId" class="form-select" th:field="*{establecimientoId}">
                    <!-- Opción vacía -->
                    <option value="" th:text="#{msg.tipoEntrada-form.establecimiento.select}"></option>

                    <!-- Una opción por cada establecimiento -->
                    <option th:each="est : ${listaEstablecimientos}" th:value="${est.id}" th:text="${est.nombre}"></option>
                </select>
                <div th:if="${#fields.hasErrors('establecimientoId')}" class="text-danger" th:errors="*{establecimientoId}"></div>
            </div>

            <!-- Botón submit dinámico -->
            <button type="submit" class="btn btn-primary"
                    th:text="${tipoEntrada.id} == null ? #{msg.tipoEntrada-form.create} : #{msg.tipoEntrada-form.update}"></button>

            <!-- Volver al listado -->
            <a th:href="@{/tipos-entrada}" class="btn btn-secondary" th:text="#{msg.tipoEntrada-form.returnback}"></a>
        </form>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
