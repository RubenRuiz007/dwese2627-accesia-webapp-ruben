<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Accesia - Establecimiento')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>
<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle del establecimiento: {nombre} -->
        <h1>
            <span th:text="#{msg.establecimiento-detail.title}"></span>:
            <span th:text="${establecimiento.nombre}"></span>
        </h1>

        <!-- Datos del establecimiento -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.establecimiento-detail.section.establecimientoData}"></h2>
            <dl class="row">
                <!-- Imagen del establecimiento -->
                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.imagen}"></dt>
                <dd class="col-sm-8">
                    <div th:if="${establecimiento.imagen == null}">
                        <span class="text-muted" th:text="#{msg.establecimiento-detail.noImage}"></span>
                    </div>
                    <div th:if="${establecimiento.imagen != null}">
                        <img th:src="@{${establecimiento.imagen}}" alt="Imagen" class="img-thumbnail rounded"
                             style="max-width: 150px;"/>
                    </div>
                </dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.id}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.id}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.nombre}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.nombre}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.tipo}"></dt>
                <dd class="col-sm-8" th:text="#{${'msg.tipoEstablecimiento.' + establecimiento.tipo}}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.direccion}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.direccion}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.descripcion}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.descripcion} ?: '-'"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.aforoMaximo}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.aforoMaximo}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.precioReferencia}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.precioReferencia} + ' €'"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.edadMinima}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.edadMinima} ?: '-'"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.exigeCuentaConfirmada}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.exigeCuentaConfirmada} ? #{msg.common.yes} : #{msg.common.no}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.aforoPublico}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.aforoPublico} ? #{msg.common.yes} : #{msg.common.no}"></dd>

                <dt class="col-sm-4" th:text="#{msg.establecimiento-detail.field.activo}"></dt>
                <dd class="col-sm-8" th:text="${establecimiento.activo} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            </dl>
        </div>

        <!-- Tipos de entrada que ofrece el establecimiento -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.establecimiento-detail.section.tiposEntrada}"></h2>

            <!-- Si no tiene tipos de entrada -->
            <div class="alert alert-info" th:if="${#lists.isEmpty(establecimiento.tiposEntrada)}"
                 th:text="#{msg.establecimiento-detail.tiposEntrada.empty}"></div>

            <!-- Tabla de tipos de entrada -->
            <div th:if="${!#lists.isEmpty(establecimiento.tiposEntrada)}" class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{msg.establecimiento-detail.tiposEntrada.col.id}"></th>
                        <th scope="col" th:text="#{msg.establecimiento-detail.tiposEntrada.col.nombre}"></th>
                        <th scope="col" th:text="#{msg.establecimiento-detail.tiposEntrada.col.precioReferencia}"></th>
                        <th scope="col" th:text="#{msg.establecimiento-detail.tiposEntrada.col.cupo}"></th>
                        <th scope="col" class="text-end" th:text="#{msg.establecimiento-detail.tiposEntrada.col.actions}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tipo : ${establecimiento.tiposEntrada}">
                        <td th:text="${tipo.id}"></td>
                        <td th:text="${tipo.nombre}"></td>
                        <td th:text="${tipo.precioReferencia} + ' €'"></td>
                        <td th:text="${tipo.cupo} ?: '-'"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/tipos-entrada/detail(id=${tipo.id})}"
                               th:text="#{msg.establecimiento-detail.viewDetail}"></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Volver -->
        <div class="mt-4">
            <a class="btn btn-secondary" th:href="@{/establecimientos}" th:text="#{msg.establecimiento-detail.action.back}"></a>
        </div>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
